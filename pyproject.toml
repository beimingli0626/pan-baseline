[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pan-baselines"
version = "0.1.0"
description = "Recurrent (LSTM, SRU), sequence-transformer and OctoMap + A* baselines for the PAN planner."
requires-python = ">=3.10"
dependencies = ["pan-nav"]

[tool.setuptools.packages.find]
include = ["baselines*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
